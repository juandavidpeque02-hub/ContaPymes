<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTA - Inicio de sesión</title>
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
    <!-- Contenedor principal para iniciar sesión -->
    <div class="login-container">
        <div class="login-box">
            <h1>Iniciar sesión</h1>
            <p>Bienvenido a CONTA. Por favor, ingrese sus credenciales para continuar.</p>
        </div>
        <form action="html/admin.html" method="get">
            <div class="form-group">
                <label for="username">Usuario o correo electrónico:</label>
                <input type="text" id="username" name="username o correo electrónico" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-actions">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Recordar sesión</label>
            </div>
            <button type="submit" class="btn-submit">Iniciar sesión</button>
            <div class="form-footer">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">Crear una cuenta</a>
        </form>
    </div>
</body>
</html>
